name: Daily Market Report

on:
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [daily-brief-trigger]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: investment-report-state
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate daily report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.main

      - name: Resolve generated snapshot
        id: snapshot
        run: |
          snapshot=$(find data/news_snapshots -maxdepth 1 -type f -name '*.json' -print -quit)
          test -n "$snapshot"
          echo "path=$snapshot" >> "$GITHUB_OUTPUT"
          echo "date=$(basename "$snapshot" .json)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: python -m pytest -v

      - name: Smoke-check generated report and HTML
        run: python -m src.smoke

      - name: Upload Stage B replay snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-snapshot-${{ steps.snapshot.outputs.date }}-${{ github.run_id }}
          path: ${{ steps.snapshot.outputs.path }}
          if-no-files-found: error

      - name: Commit durable report and state changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          core_valid=$(python3 -c "
          import json
          try:
              report = json.load(open('data/reports/${{ steps.snapshot.outputs.date }}.json', encoding='utf-8'))
              print('true' if report.get('core_market_valid') else 'false')
          except FileNotFoundError:
              print('false')
          ")
          echo "core_valid=$core_valid" >> "$GITHUB_OUTPUT"
          if [ "$core_valid" != "true" ]; then
            echo "[MARKET GUARD] core market invalid, skip persistent commit"
            exit 0
          fi
          git add data/reports state site
          if git diff --cached --quiet; then
            echo "No report or state changes to commit."
          else
            git commit -m "chore(data): generate report $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase
            git push
          fi

      - name: Setup GitHub Pages
        if: steps.commit.outputs.core_valid == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site/ as Pages artifact
        if: steps.commit.outputs.core_valid == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.core_valid == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
