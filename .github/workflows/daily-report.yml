name: Daily Market Report

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investment-report-state
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate daily report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.main

      - name: Resolve generated snapshot
        id: snapshot
        run: |
          snapshot=$(find data/news_snapshots -maxdepth 1 -type f -name '*.json' -print -quit)
          test -n "$snapshot"
          echo "path=$snapshot" >> "$GITHUB_OUTPUT"
          echo "date=$(basename "$snapshot" .json)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: python -m pytest -v

      - name: Smoke-check generated report and HTML
        run: python -m src.smoke

      - name: Upload Stage B replay snapshot
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-snapshot-${{ steps.snapshot.outputs.date }}-${{ github.run_id }}
          path: ${{ steps.snapshot.outputs.path }}
          if-no-files-found: error

      - name: Commit durable report and state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports state site
          if git diff --cached --quiet; then
            echo "No report or state changes to commit."
          else
            git commit -m "chore(data): generate report $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase
            git push
          fi
