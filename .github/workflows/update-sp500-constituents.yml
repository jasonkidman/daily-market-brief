name: Update S&P 500 Constituents

on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investment-report-state
  cancel-in-progress: false

jobs:
  update-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update official SPY constituent reference
        run: python -m src.update_sp500_constituents

      - name: Validate constituent updater
        run: python -m pytest -v tests/test_constituents.py

      - name: Commit changed reference only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/sp500_constituents.csv
          if git diff --cached --quiet; then
            echo "Constituent reference unchanged."
          else
            git commit -m "chore(data): update S&P 500 constituents"
            git pull --rebase
            git push
          fi
