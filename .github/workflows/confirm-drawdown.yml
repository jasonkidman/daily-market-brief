name: 确认回撤加仓

on:
  workflow_dispatch:
    inputs:
      index:
        description: 选择指数
        required: true
        type: choice
        options:
          - sp500
          - nasdaq100
      tier:
        description: 选择档位
        required: true
        type: choice
        options:
          - tier_1
          - tier_2
          - tier_3
          - tier_4

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: investment-report-state
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Confirm pending tier and rerender site
        run: python -m src.confirm_drawdown "${{ inputs.index }}" "${{ inputs.tier }}"

      - name: Run tests
        run: pytest -v

      - name: Smoke-check generated report and HTML
        run: python -m src.smoke

      - name: Commit confirmation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state data/reports site
          if git diff --cached --quiet; then
            echo "Tier was already executed; no changes to commit."
          else
            git commit -m "chore(state): confirm ${{ inputs.index }} ${{ inputs.tier }}"
            git pull --rebase
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: confirm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
